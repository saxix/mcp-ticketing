[tox]
envlist = lint, typecheck, test
skip_missing_interpreters = true

[testenv]
description = Run tests
commands =
    pytest tests/ {posargs:-q}

[testenv:lint]
description = Lint with ruff
skip_install = true
deps =
    ruff>=0.11
commands =
    ruff check src tests {posargs}
    ruff format --check src tests {posargs}

[testenv:format]
description = Auto-format with ruff
skip_install = true
deps =
    ruff>=0.11
commands =
    ruff check --fix src tests {posargs}
    ruff format src tests {posargs}

[testenv:typecheck]
description = Type check with mypy
skip_install = true
deps =
    mypy>=1.15
commands =
    mypy src/mcp_ticketing {posargs}

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit>=4.2
commands =
    pre-commit run --all-files {posargs}
