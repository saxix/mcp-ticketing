[tox]
envlist = lint, typecheck, test
skip_missing_interpreters = true

[testenv]
description = Run unit + mocked tests with coverage (no network, no docker)
dependency_groups = dev
commands =
    pytest tests/ --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=95 {posargs:-q}

[testenv:coverage]
description = Combined coverage across unit + integration fake-server tests (requires docker)
allowlist_externals = docker
setenv =
    COVERAGE_FILE = {envdir}/.coverage
commands =
    coverage erase
    docker compose -f tests/docker/docker-compose.yml up -d --build --wait
    pytest tests/ --cov --cov-report= {posargs:-q}
    pytest tests/ -m integration --cov --cov-append --cov-report=
    coverage report --show-missing --fail-under=95
commands_post =
    docker compose -f tests/docker/docker-compose.yml down -v

[testenv:test-live]
description = Run live tests against real Azure DevOps / GitHub APIs (requires .envrc)
commands =
    pytest tests/ -m live {posargs:-q}

[testenv:integration]
description = Run integration tests against docker-compose fake servers
allowlist_externals = docker
commands =
    docker compose -f tests/docker/docker-compose.yml up -d --build --wait
    pytest tests/ -m integration {posargs:-q}
commands_post =
    docker compose -f tests/docker/docker-compose.yml down -v

[testenv:lint]
description = Lint with ruff
skip_install = true
deps =
    ruff>=0.11
commands =
    ruff check src tests {posargs}
    ruff format --check src tests {posargs}

[testenv:format]
description = Auto-format with ruff
skip_install = true
deps =
    ruff>=0.11
commands =
    ruff check --fix src tests {posargs}
    ruff format src tests {posargs}

[testenv:typecheck]
description = Type check with mypy
skip_install = true
deps =
    mypy>=1.15
commands =
    mypy src/mcp_ticketing {posargs}

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit>=4.2
commands =
    pre-commit run --all-files {posargs}
