[project]
name = "mcp-ticketing"
version = "0.2.0"
description = "MCP server for Azure DevOps and GitHub Issues ticketing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Stefano Apostolico", email = "s.apostolico@gmail.com" }]
keywords = ["mcp", "gitHub", "azure", "azure-devops", "ticketing", "issues", "model-context-protocol"]
dependencies = [
    "httpx>=0.28.1",
    "markdown>=3.0",
    "mcp-server>=0.1.4",
    "mermaidx>=0.9",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/saxix/mcp-ticketing"
Repository = "https://github.com/saxix/mcp-ticketing"
Documentation = "https://saxix.github.io/mcp-ticketing/"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ticketing"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6",
    "properdocs>=1.2",
    "properdocs-theme-mkdocs>=1.6",
    "pymdown-extensions>=11.0.2",
    "respx>=0.22",
    "ruff>=0.11",
    "tox>=4.25",
    "tox-uv>=1.25",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_ticketing"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "strict"
addopts = "-m 'not live and not integration'"
markers = [
    "live: tests that call the real Azure DevOps / GitHub APIs (opt-in: pytest -m live)",
    "integration: tests that require the docker-compose fake servers (tox -e integration)",
]

[tool.coverage.run]
source = ["mcp_ticketing"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[project.scripts]
mcp-ticketing = "mcp_ticketing.main:main"
