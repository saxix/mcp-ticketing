[project]
name = "mcp-ticketing"
version = "0.2.0"
description = "MCP server for Azure DevOps, GitHub, Taiga and Redmine ticketing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp-server>=0.1.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ticketing"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "properdocs>=1.2",
    "properdocs-theme-mkdocs>=1.6",
    "pymdown-extensions>=11.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
mcp-ticketing = "mcp_ticketing.main:main"
