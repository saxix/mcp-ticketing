name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff check
        run: uv run tox -e lint
      - name: Type check
        run: uv run tox -e typecheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --all-groups
      - name: Tests
        run: uv run tox -e test
